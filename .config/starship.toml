"$schema" = 'https://starship.rs/config-schema.json'

# HUD prompt, same language as the Quickshell bar:
#
#   // ~/.config/quickshell   main !2   v17 ──────────── 2s  09:41 PM
#   ❯
#
# Colours come from [palettes.wallpaper] at the bottom, which
# ~/.config/theme/wallpaper-theme rewrites whenever the wallpaper changes.
# Previous config: ~/.local/share/dotfile-backups/2026-10-02/.config/starship.toml.bak-2026-10-02

palette = "wallpaper"
add_newline = true
command_timeout = 800

format = """
[// ](bold fg:accent)\
$username$hostname\
$directory\
$git_branch$git_state$git_status\
$c$cpp$rust$golang$python$nodejs$lua$java$zig\
$nix_shell$container\
$fill\
$cmd_duration$jobs$status$time
$character"""

continuation_prompt = "[   ](fg:faint)"

[fill]
symbol = "─"
style = "fg:border"

[character]
success_symbol = "[❯](bold fg:accent)"
error_symbol = "[❯](bold fg:danger)"
vimcmd_symbol = "[❮](bold fg:accent2)"
vimcmd_visual_symbol = "[❮](bold fg:yellow)"
vimcmd_replace_symbol = "[❮](bold fg:magenta)"
vimcmd_replace_one_symbol = "[❮](bold fg:magenta)"

[username]
format = "[$user]($style)[@](fg:faint)"
style_user = "fg:dim"
style_root = "bold fg:danger"

[hostname]
format = "[$ssh_symbol$hostname]($style) "
ssh_symbol = "󰣀 "
style = "fg:dim"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold fg:text"
read_only = " 󰌾"
read_only_style = "fg:danger"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
home_symbol = "~"

[git_branch]
format = "[ ](fg:faint)[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "fg:accent2"

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "bold fg:yellow"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "fg:danger"
conflicted = "≠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[c]
format = "[ $symbol($version)]($style) "
symbol = " "
style = "fg:dim"

[cpp]
disabled = false
format = "[ $symbol($version)]($style) "
symbol = " "
style = "fg:dim"

[rust]
format = "[ $symbol($version)]($style) "
symbol = "󱘗 "
style = "fg:dim"

[golang]
format = "[ $symbol($version)]($style) "
symbol = " "
style = "fg:dim"

[python]
format = "[ $symbol$pyenv_prefix($version)( \\($virtualenv\\))]($style) "
symbol = " "
style = "fg:dim"

[nodejs]
format = "[ $symbol($version)]($style) "
symbol = " "
style = "fg:dim"

[lua]
format = "[ $symbol($version)]($style) "
symbol = " "
style = "fg:dim"

[java]
format = "[ $symbol($version)]($style) "
symbol = " "
style = "fg:dim"

[zig]
format = "[ $symbol($version)]($style) "
symbol = " "
style = "fg:dim"

[nix_shell]
format = "[ $symbol$state]($style) "
symbol = " "
style = "fg:accent2"

[container]
format = "[ $symbol$name]($style) "
symbol = "󰡨 "
style = "fg:dim"

[cmd_duration]
min_time = 2000
format = "[ 󱦟 $duration]($style)"
style = "fg:yellow"

[jobs]
format = "[ $symbol$number]($style)"
symbol = "󰜎 "
style = "fg:accent2"

[status]
disabled = false
format = "[ ✘ $status]($style)"
style = "fg:danger"

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%I:%M %p"
style = "fg:dim"

# --- generated by ~/.config/theme/wallpaper-theme: do not edit below ---
[palettes.wallpaper]
accent = "#ffffff"
accent2 = "#bfbfbf"
text = "#f0f0f0"
dim = "#999999"
faint = "#575757"
border = "#383838"
frame = "#575757"
danger = "#f04c69"
yellow = "#caba91"
magenta = "#ca91c4"
