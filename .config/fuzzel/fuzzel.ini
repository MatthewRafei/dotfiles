# HUD-style launcher: centered, square corners, mono type.
# Colours in [colors] are rewritten by ~/.config/theme/wallpaper-theme.

[main]
font=JetBrainsMono Nerd Font:size=12
use-bold=yes
dpi-aware=auto
prompt="//  "
placeholder=search
terminal=alacritty -e
layer=overlay
exit-on-keyboard-focus-loss=yes
anchor=center
width=46
lines=10
tabs=4
horizontal-pad=22
vertical-pad=18
inner-pad=14
line-height=24
letter-spacing=0.5
match-counter=yes
icons-enabled=yes
image-size-ratio=0

[colors]
background=0b060bf2
text=a78ba4ff
prompt=f174e3ff
placeholder=634b60ff
input=f4ecf3ff
match=f174e3ff
selection=261725ff
selection-text=f4ecf3ff
selection-match=f174e3ff
border=f174e399

[border]
width=1
radius=3
selection-radius=2

[dmenu]
exit-immediately-if-empty=yes
