# HUD-style launcher: centered, square corners, mono type.
# Colours in [colors] are rewritten by ~/.config/theme/wallpaper-theme.

[main]
font=JetBrainsMono Nerd Font:size=12
use-bold=yes
dpi-aware=auto
prompt="//  "
placeholder=search
terminal=alacritty -e
layer=overlay
exit-on-keyboard-focus-loss=yes
anchor=center
width=46
lines=10
tabs=4
horizontal-pad=22
vertical-pad=18
inner-pad=14
line-height=24
letter-spacing=0.5
match-counter=yes
icons-enabled=yes
image-size-ratio=0

[colors]
background=090909f2
text=999999ff
prompt=ffffffff
placeholder=575757ff
input=f0f0f0ff
match=ffffffff
selection=1f1f1fff
selection-text=f0f0f0ff
selection-match=ffffffff
border=ffffff99

[border]
width=1
radius=3
selection-radius=2

[dmenu]
exit-immediately-if-empty=yes
